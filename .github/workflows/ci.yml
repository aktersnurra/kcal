name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.0
      - run: opam install --yes . --deps-only --with-test --with-dev-setup
      - run: opam exec -- dune build @all
      - run: opam exec -- dune runtest
      - run: opam exec -- dune build @fmt

  # serai update on the NUC deploys what this job marks: a commit on master
  # whose tests passed. Pushed without force, so deploy only moves forward.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push origin HEAD:refs/heads/deploy
